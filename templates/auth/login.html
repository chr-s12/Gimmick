{% extends "authBase.html" %}
{% block title %}Log in{% endblock %}
{% block heading %}Login{% endblock %}
{% block content %}
<form method="post" action="{{ url_for('auth.login') }}" novalidate>
	<input type="hidden" name="next" value="{{ next or '' }}">
	<div class="fields-box">
		<div class="field">
			<label for="uwiId">UWI ID number</label>
			<input type="text" id="uwiId" name="uwiId" inputmode="numeric" autocomplete="username" value="{{ uwiId }}" required autofocus>
		</div>
		<div class="field">
			<label for="password">Password</label>
			<input type="password" id="password" name="password" autocomplete="current-password" required>
		</div>
	</div>
	<button class="btn" type="submit">Log In</button>
</form>
<p class="small" style="margin-top:16px">Don't have an account? <a href="{{ url_for('auth.signup') }}">Register here</a></p>
<p class="small muted">Forgot your password? Ask the front desk. Staff will check your UWI ID and reset it.</p>
{% endblock %}
