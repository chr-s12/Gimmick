{% extends "base.html" %}
{% block title %}Reset a password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Reset a password</h1><p>Check the person's UWI ID card first, then set a new password for them.</p></div></div>
<form class="card" method="post" autocomplete="off">
	<div class="field-row">
		<div class="field"><label for="uwiId">UWI ID number</label><input type="text" id="uwiId" name="uwiId" inputmode="numeric" required></div>
		<div class="field"><label for="password">New password</label><input type="password" id="password" name="password" autocomplete="new-password" required></div>
	</div>
	<p class="small muted">At least 8 characters, with a letter and a number. Resetting also unlocks a locked account.</p>
	<button class="btn" type="submit">Reset password</button>
</form>
{% endblock %}
